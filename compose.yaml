services:
  web:
    image: konvert-wishlist-notify:local
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.runtime
    environment:
      NODE_ENV: production
      HOST: "0.0.0.0"
      PORT: "3000"
      REDIS_URL: redis://redis:6379
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    init: true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const net=require('node:net');const s=net.connect(3000,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    image: konvert-wishlist-notify:local
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.runtime
    environment:
      NODE_ENV: production
      WORKER_SKIP_DOTENV: "1"
      REDIS_URL: redis://redis:6379
    command: ["node", "app/worker/cron.js"]
    restart: unless-stopped
    init: true
    stop_grace_period: 50s

  # Analytics cache only: nothing is kept on disk and no host port is published. The app works without it
  # (REDIS_URL unset, or Redis down, means the reports are simply calculated every time).
      # Analytics cache only: Redis data is held in memory.
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      
  migrate:
    image: konvert-wishlist-notify:local
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.runtime
    environment:
      NODE_ENV: production
    command: ["./node_modules/.bin/prisma", "migrate", "deploy"]
    profiles:
      - operations
    restart: "no"
